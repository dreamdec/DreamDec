name: Deploy

# Manual only, on purpose. GitHub is a backup of the source, not part of
# publishing: dreamdec.pages.dev is updated from this machine with wrangler.
# A push trigger here could only ever fail (no Cloudflare credentials on the
# account), and it emailed a failure for every single push.
on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Two runs at once would race, and the loser could land last.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build
        run: node build.mjs

      - name: Check internal links
        run: node check-links.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dreamdec
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
