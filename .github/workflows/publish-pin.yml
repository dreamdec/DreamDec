name: Publish a pin

# PARKED 2026-10-30. The app has Trial access, and Pinterest makes all Pins and Boards
# created with Trial access sandbox entities that only the account owner can see. Running
# this on a schedule would therefore (a) post three invisible pins a day and (b) poison the
# dedupe in publish-pins.mjs, which matches on the destination link - so after Standard
# access is approved it would report every pin as already posted and publish nothing.
# To re-arm: uncomment the two schedule lines below, and delete any pins the Trial runs
# created from the board first.
#
# Three runs a day, one pin each. 19:00 / 22:00 / 01:00 Bangladesh time is
# 13:00 / 16:00 / 19:00 UTC, and the runner clock is UTC.
on:
  # schedule:
  #   - cron: '0 13,16,19 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many pins to publish now'
        default: '1'
        type: choice
        options: ['1', '2', '3']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # publish-pins.mjs checks dist/pins/ exists before it will name a source
      # URL, so the queue needs a build even though this job deploys nothing.
      - name: Build
        run: node build.mjs

      # `secrets` is not readable from a step-level `if`, so the guard has to
      # live in the shell. A schedule with no token exits green rather than
      # failing three times a day until Pinterest is connected.
      - name: Publish
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          # Without this the expiry warning in publish-pins.mjs can only fire
          # locally, and the schedule would just start failing with a 401.
          PINTEREST_TOKEN_EXPIRES_AT: ${{ secrets.PINTEREST_TOKEN_EXPIRES_AT }}
          COUNT: ${{ inputs.count || '1' }}
        run: |
          if [ -z "$PINTEREST_ACCESS_TOKEN" ]; then
            echo "PINTEREST_ACCESS_TOKEN is not set as a repository secret yet - nothing published."
            exit 0
          fi
          n=0
          while [ "$n" -lt "$COUNT" ]; do
            node publish-pins.mjs || exit 1
            n=$((n + 1))
          done
