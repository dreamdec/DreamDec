name: Publish a pin

# Three runs a day, one pin each. 19:00 / 22:00 / 01:00 Bangladesh time is
# 13:00 / 16:00 / 19:00 UTC, and the runner clock is UTC.
on:
  schedule:
    - cron: '0 13,16,19 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many pins to publish now'
        default: '1'
        type: choice
        options: ['1', '2', '3']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # publish-pins.mjs checks dist/pins/ exists before it will name a source
      # URL, so the queue needs a build even though this job deploys nothing.
      - name: Build
        run: node build.mjs

      # `secrets` is not readable from a step-level `if`, so the guard has to
      # live in the shell. A schedule with no token exits green rather than
      # failing three times a day until Pinterest is connected.
      - name: Publish
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          COUNT: ${{ inputs.count || '1' }}
        run: |
          if [ -z "$PINTEREST_ACCESS_TOKEN" ]; then
            echo "PINTEREST_ACCESS_TOKEN is not set as a repository secret yet - nothing published."
            exit 0
          fi
          n=0
          while [ "$n" -lt "$COUNT" ]; do
            node publish-pins.mjs || exit 1
            n=$((n + 1))
          done
